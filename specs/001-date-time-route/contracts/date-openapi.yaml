openapi: 3.1.0
info:
  title: Speckit Date API
  version: 1.0.0
  description: Contract for GET /date endpoint.
paths:
  /date:
    get:
      summary: Get current time for major time zones
      operationId: getDateTimes
      tags:
        - Utility
      description: Returns fixed major timezone times from one snapshot timestamp.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateSuccessResponse'
              examples:
                default:
                  value:
                    success: true
                    message: 当前时间查询成功
                    data:
                      snapshotAt: '2026-04-10T08:30:00.000Z'
                      timezones:
                        - timezone: UTC
                          label: 协调世界时
                          datetime: '2026-04-10 08:30:00'
                          offset: '+00:00'
                        - timezone: Asia/Shanghai
                          label: 中国标准时间
                          datetime: '2026-04-10 16:30:00'
                          offset: '+08:00'
        '500':
          description: Time generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DateErrorResponse'
              examples:
                default:
                  value:
                    success: false
                    message: 时间数据生成失败
                    error: TIME_GENERATION_FAILED
components:
  schemas:
    DateSuccessResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: object
          required:
            - snapshotAt
            - timezones
          properties:
            snapshotAt:
              type: string
              format: date-time
            timezones:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/TimeZoneEntry'
    DateErrorResponse:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        error:
          type: string
          enum:
            - TIME_GENERATION_FAILED
    TimeZoneEntry:
      type: object
      required:
        - timezone
        - label
        - datetime
        - offset
      properties:
        timezone:
          type: string
          description: IANA timezone ID
          enum:
            - UTC
            - Asia/Shanghai
            - Asia/Tokyo
            - Europe/London
            - Europe/Paris
            - America/New_York
            - America/Los_Angeles
            - Australia/Sydney
        label:
          type: string
          description: Human-readable label
        datetime:
          type: string
          description: Local date-time string
        offset:
          type: string
          pattern: '^[+-][0-9]{2}:[0-9]{2}$'
